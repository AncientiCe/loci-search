name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: loci
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: loci.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      TARGET: ${{ matrix.target }}
      EXECUTABLE: ${{ matrix.executable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target $env:TARGET
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Check formatting
        run: cargo +1.95.0 fmt --check
      - name: Lint
        run: cargo +1.95.0 clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +1.95.0 test --locked
      - name: Build the release binary
        run: cargo +1.95.0 build --locked --release --target $env:TARGET
      - name: Smoke-test and package the release binary
        run: |
          & "./target/$env:TARGET/release/$env:EXECUTABLE" bench --fixture --chunks 128 --repeats 1 --out runs/ci-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/release.py package --target $env:TARGET --output dist
      - name: Score the workload fixtures and rehearse cutover
        run: |
          python benchmarks/workloads/live.py --binary "./target/$env:TARGET/release/$env:EXECUTABLE" --scorecard runs/workload-scorecard.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/rehearse_cutover.py --binary "./target/$env:TARGET/release/$env:EXECUTABLE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  package:
    name: Package and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: rustup toolchain install 1.95.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: python3 .github/scripts/release.py notes --output "$RUNNER_TEMP/release-notes.md"
      - run: cargo +1.95.0 publish --dry-run --locked
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-audit@0.22.1
      - run: cargo audit --deny warnings
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [checks, package]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require all checks
        env:
          TESTS: ${{ needs.checks.result }}
          PACKAGE: ${{ needs.package.result }}
        run: test "$TESTS" = success && test "$PACKAGE" = success
