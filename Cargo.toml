[package]
name = "loci-search"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "SQLite-backed hybrid retrieval with semantic region routing and per-hit explanations"
license = "MIT"
repository = "https://github.com/AncientiCe/loci-search"
readme = "README.md"
publish = ["crates-io"]
keywords = ["search", "retrieval", "hybrid-search", "sqlite", "vector-search"]
categories = ["command-line-utilities", "database-implementations"]
include = [
    "/src/**",
    "/tests/**",
    "/tools/*.py",
    "/docs/images/*.png",
    "/docs/images/*.svg",
    "/docs/releasing.md",
    "/benchmarks/*.md",
    "/benchmarks/*.json",
    "/benchmarks/workloads/**",
    "/docs/server.md",
    "/docs/openapi.json",
    "/clients/**",
    "/examples/**",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/SECURITY.md",
]

[[bin]]
name = "loci"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
sha2 = "0.10"
tempfile = "3"
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["std", "api-24", "download-binaries", "tls-rustls"] }
kitoken = { version = "=0.11.1", optional = true, default-features = false, features = ["std", "normalization", "convert-tokenizers", "split"] }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
rusqlite = { version = "0.43", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5", default-features = false, features = ["json", "rustls"] }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
jiff = "1"
regex = "1"

[features]
default = ["local-model"]
local-model = ["dep:ort", "dep:kitoken"]
