[package]
name = "loci-search"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "loci"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3"
