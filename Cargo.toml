[package]
name = "loci-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "SQLite-backed hybrid retrieval with semantic region routing and per-hit explanations"
license = "MIT"
repository = "https://github.com/AncientiCe/loci-search"
readme = "README.md"
publish = ["crates-io"]
keywords = ["search", "retrieval", "hybrid-search", "sqlite", "vector-search"]
categories = ["command-line-utilities", "database-implementations"]
include = [
    "/src/**",
    "/tests/**",
    "/tools/*.py",
    "/docs/images/*.png",
    "/docs/releasing.md",
    "/benchmarks/*.md",
    "/benchmarks/*.json",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/SECURITY.md",
]

[[bin]]
name = "loci"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3"
