# Local durable store for Loci. Loopback only; credentials come from the environment.
# No passwords belong in this file.
#
#   $env:POSTGRES_USER = "loci"
#   $env:POSTGRES_PASSWORD = "<local password>"
#   $env:POSTGRES_DB = "loci"          # optional
#   $env:POSTGRES_PORT = "54329"       # optional
#   docker compose -f deploy/postgres/compose.yaml up -d

name: loci-search

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-loci}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - loci-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 4s

volumes:
  loci-postgres:
    name: loci-search-postgres
