<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-labelledby="title desc">
<title id="title">Loci regional search compared with Elasticsearch</title>
<desc id="desc">Held-out Recall@100 and warm p95 latency. HotpotQA 1M: Loci 89.38% at 31.01 ms, Elasticsearch 90.00% at 41.20 ms. FiQA: Loci 73.64% at 14.33 ms, Elasticsearch 64.98% at 21.21 ms. NFCorpus: Loci 35.41% at 1.85 ms, Elasticsearch 32.99% at 20.70 ms.</desc>
