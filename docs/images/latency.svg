<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title desc">
<title id="title">p95 latency: Loci hybrid compared with Elasticsearch</title>
<desc id="desc">p95 latency over HTTP on Linux at equal quality. HotpotQA 1M raw text: Loci 25.4 ms, Elasticsearch 33.8 ms. HotpotQA 1M precomputed vectors: Loci 13.0 ms, Elasticsearch 20.3 ms. FiQA precomputed vectors: Loci 4.7 ms, Elasticsearch 17.0 ms.</desc>
<style>
  svg { --bg:#fcfcfb; --t1:#0b0b0b; --t2:#52514e; --t3:#77766f; --grid:#e4e3df; --line:#c9c8c2; --s1:#2a78d6; --s2:#eb6834; --box:#f3f2ef; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#1a1a19; --t1:#f0efec; --t2:#c3c2b7; --t3:#9a998f; --grid:#363633; --line:#4a4a46; --s1:#3987e5; --s2:#d95926; --box:#242423; }
  }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .bg { fill: var(--bg); }
  .t1 { fill: var(--t1); } .t2 { fill: var(--t2); } .t3 { fill: var(--t3); }
  .s1 { fill: var(--s1); } .s2 { fill: var(--s2); }
  .ls1 { stroke: var(--s1); } .ls2 { stroke: var(--s2); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--line); stroke-width: 1; }
  .box { fill: var(--box); stroke: var(--line); stroke-width: 1; }
  .accent { fill: var(--box); stroke: var(--s1); stroke-width: 1.5; }
  .arrow { stroke: var(--t3); stroke-width: 1.5; fill: none; }
  .ttl { font-size: 20px; font-weight: 600; }
  .sub { font-size: 13px; }
  .h { font-size: 14px; font-weight: 600; }
  .s { font-size: 12px; }
  .v { font-size: 13px; font-variant-numeric: tabular-nums; }
  .vb { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .lg { font-size: 13px; }
</style>
<rect class="bg" width="960" height="400" rx="12"/>
<text class="t1 ttl" x="28" y="42">p95 latency at equal quality</text>
<text class="t2 sub" x="28" y="64">Lower is better. Linux, both engines over HTTP, same vectors and reranker, three passes over the held-out queries.</text>
<rect class="s1" x="28" y="86" width="12" height="12" rx="3"/>
<text class="t2 lg" x="46" y="96">Loci hybrid</text>
<rect class="s2" x="140" y="86" width="12" height="12" rx="3"/>
<text class="t2 lg" x="158" y="96">Elasticsearch 8.19</text><line class="grid" x1="300" y1="114" x2="300" y2="356"/>
<text class="t3 s" x="300" y="374" text-anchor="middle">0 ms</text><line class="grid" x1="440" y1="114" x2="440" y2="356"/>
<text class="t3 s" x="440" y="374" text-anchor="middle">10 ms</text><line class="grid" x1="580" y1="114" x2="580" y2="356"/>
<text class="t3 s" x="580" y="374" text-anchor="middle">20 ms</text><line class="grid" x1="720" y1="114" x2="720" y2="356"/>
<text class="t3 s" x="720" y="374" text-anchor="middle">30 ms</text><line class="grid" x1="860" y1="114" x2="860" y2="356"/>
<text class="t3 s" x="860" y="374" text-anchor="middle">40 ms</text><text class="t1 h" x="28" y="146">HotpotQA 1M, raw text</text>
<text class="t3 s" x="28" y="164">query encoding included</text>
<text class="t1 vb" x="28" y="184">Loci 25% faster</text>
<path class="s1" d="M300 132h350.9a4 4 0 0 1 4 4v14a4 4 0 0 1 -4 4h-350.9z"/>
<text class="t1 v" x="662.9" y="148">25.4 ms</text>
<path class="s2" d="M300 158h468.91999999999996a4 4 0 0 1 4 4v14a4 4 0 0 1 -4 4h-468.91999999999996z"/>
<text class="t1 v" x="780.92" y="174">33.8 ms</text><text class="t1 h" x="28" y="228">HotpotQA 1M, precomputed vectors</text>
<text class="t3 s" x="28" y="246">engine only</text>
<text class="t1 vb" x="28" y="266">Loci 36% faster</text>
<path class="s1" d="M300 214h178a4 4 0 0 1 4 4v14a4 4 0 0 1 -4 4h-178z"/>
<text class="t1 v" x="490" y="230">13.0 ms</text>
<path class="s2" d="M300 240h280.3399999999999a4 4 0 0 1 4 4v14a4 4 0 0 1 -4 4h-280.3399999999999z"/>
<text class="t1 v" x="592.3399999999999" y="256">20.3 ms</text><text class="t1 h" x="28" y="310">FiQA, precomputed vectors</text>
<text class="t3 s" x="28" y="328">engine only</text>
<text class="t1 vb" x="28" y="348">Loci 72% faster</text>
<path class="s1" d="M300 296h62.22000000000003a4 4 0 0 1 4 4v14a4 4 0 0 1 -4 4h-62.22000000000003z"/>
<text class="t1 v" x="374.22" y="312">4.7 ms</text>
<path class="s2" d="M300 322h234.27999999999997a4 4 0 0 1 4 4v14a4 4 0 0 1 -4 4h-234.27999999999997z"/>
<text class="t1 v" x="546.28" y="338">17.0 ms</text><line class="axis" x1="300" y1="114" x2="300" y2="356"/>
</svg>
