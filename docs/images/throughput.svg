<text class="t3 s" x="72" y="344" text-anchor="end">0</text><line class="grid" x1="80" y1="289" x2="410" y2="289"/>
<text class="t3 s" x="72" y="293" text-anchor="end">100</text><line class="grid" x1="80" y1="238" x2="410" y2="238"/>
<text class="t3 s" x="72" y="242" text-anchor="end">200</text><line class="grid" x1="80" y1="187" x2="410" y2="187"/>
<text class="t3 s" x="72" y="191" text-anchor="end">300</text><line class="grid" x1="80" y1="136" x2="410" y2="136"/>
