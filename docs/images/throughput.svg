<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc">
<title id="title">Throughput: Loci hybrid compared with Elasticsearch</title>
<desc id="desc">Queries per second at 1, 4, 8, and 16 clients. HotpotQA 1M raw text: Loci 54, 212, 343, 429; Elasticsearch 36, 138, 222, 276. FiQA precomputed vectors: Loci 374, 1340, 2135, 2629; Elasticsearch 70, 260, 397, 396.</desc>
<style>
  svg { --bg:#fcfcfb; --t1:#0b0b0b; --t2:#52514e; --t3:#77766f; --grid:#e4e3df; --line:#c9c8c2; --s1:#2a78d6; --s2:#eb6834; --box:#f3f2ef; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#1a1a19; --t1:#f0efec; --t2:#c3c2b7; --t3:#9a998f; --grid:#363633; --line:#4a4a46; --s1:#3987e5; --s2:#d95926; --box:#242423; }
  }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .bg { fill: var(--bg); }
  .t1 { fill: var(--t1); } .t2 { fill: var(--t2); } .t3 { fill: var(--t3); }
  .s1 { fill: var(--s1); } .s2 { fill: var(--s2); }
  .ls1 { stroke: var(--s1); } .ls2 { stroke: var(--s2); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--line); stroke-width: 1; }
  .box { fill: var(--box); stroke: var(--line); stroke-width: 1; }
  .accent { fill: var(--box); stroke: var(--s1); stroke-width: 1.5; }
  .arrow { stroke: var(--t3); stroke-width: 1.5; fill: none; }
  .ttl { font-size: 20px; font-weight: 600; }
  .sub { font-size: 13px; }
  .h { font-size: 14px; font-weight: 600; }
  .s { font-size: 12px; }
  .v { font-size: 13px; font-variant-numeric: tabular-nums; }
  .vb { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .lg { font-size: 13px; }
</style>
<rect class="bg" width="960" height="420" rx="12"/>
<text class="t1 ttl" x="28" y="42">Queries per second with concurrent clients</text>
<text class="t2 sub" x="28" y="64">Higher is better. One shared index per engine, all clients on the same 16-CPU Linux VM.</text>
<rect class="s1" x="28" y="86" width="12" height="12" rx="3"/>
<text class="t2 lg" x="46" y="96">Loci hybrid</text>
<rect class="s2" x="140" y="86" width="12" height="12" rx="3"/>
